# The quality gate, in one place, called by both ci.yml and deploy.yml.
#
# Reusable rather than duplicated so there is no way for the checks that guard
# a pull request to drift from the checks that guard production.
name: Checks

on:
  workflow_call:

jobs:
  checks:
    name: Typecheck, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the `packageManager` field in package.json,
      # so CI cannot end up on a different pnpm than the Dockerfile.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `prisma.config.ts` resolves env('DIRECT_URL') when the config loads,
      # but `generate` never connects — it only reads the schema. Same
      # placeholder the Dockerfile uses, for the same reason.
      - name: Generate Prisma client
        run: pnpm prisma:generate
        env:
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      # tsconfig.build.json, not tsconfig.json: this has to match what the
      # image actually compiles. The wider config also typechecks the specs,
      # which is useful locally but would gate a deploy on test-only noise.
      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.build.json

      - name: Unit tests
        run: pnpm test

      # Not a gate yet, on purpose. The repository currently has a few hundred
      # outstanding prettier findings that predate this pipeline; making them
      # blocking from day one would mean every deploy is red for a reason that
      # has nothing to do with the change being deployed. Fix the backlog,
      # then delete `continue-on-error` — leaving it here forever defeats the
      # point of running it at all.
      - name: Lint (advisory)
        run: pnpm lint
        continue-on-error: true
