# Pull requests and branch pushes. Pushes to master are covered by deploy.yml,
# which runs the same checks before it builds anything, so they are excluded
# here rather than run twice.
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  image:
    name: Build the production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: the point is to find out that the multi-stage
      # build broke here, rather than on master with a deploy waiting behind
      # it. The cache is shared with deploy.yml, so the real deploy build is
      # mostly cache hits.
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
