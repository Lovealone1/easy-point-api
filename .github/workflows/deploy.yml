# Master to production, with no one logging into the server.
#
# Three stages, each gating the next: the checks that guard every pull request,
# then an image built once by the runner, then a replacement of the API
# container on the VPS. Nothing is built on the server and nothing is pulled
# from git there — see docs/CI_CD.md for why, and for the one-time setup.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing image tag to deploy (a commit SHA). Leave empty to build this commit. Use it to roll forward to a known-good build.'
        required: false
        type: string

# Serialised, never cancelled. Two deploys overlapping means two `prisma
# migrate deploy` runs against one database; cancelling one mid-flight can
# leave the API container replaced but unverified.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  checks:
    # Skipped when redeploying an existing tag: that artefact already passed
    # these checks when it was built, and re-running them proves nothing about
    # the image being deployed.
    if: inputs.tag == ''
    uses: ./.github/workflows/checks.yml

  build:
    name: Build and publish the image
    needs: checks
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects an uppercase path, and `github.repository` preserves
      # whatever case the org and repo were created with.
      - name: Resolve image name and tag
        id: meta
        run: |
          echo "repo=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # The commit SHA is the only tag the deploy ever names. `latest` is
      # published for humans reading the package page; nothing resolves it,
      # because "deploy latest" and "roll back" cannot both be true.
      - name: Runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The runtime image deliberately has no Prisma CLI (~180MB of build
      # tooling). Migrations run from the `build` stage instead, published
      # under its own tag. Most of its layers are shared with the build above,
      # so this costs little beyond the push.
      - name: Migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          push: true
          tags: ${{ steps.meta.outputs.repo }}:migrate-${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Replace the API container
    needs: build
    # `always()` so a manual redeploy of an existing tag still runs even though
    # `build` was skipped. The second clause is what keeps a *failed* check
    # from reaching here by the same route: a skipped build only counts as
    # deployable when an explicit tag said which artefact to ship.
    if: always() && (inputs.tag != '' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Attach required reviewers or a deployment branch rule to this
    # environment in the repository settings if a deploy should need approval.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Resolve what to deploy
        id: target
        run: |
          echo "repo=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=${{ inputs.tag || needs.build.outputs.tag }}" >> "$GITHUB_OUTPUT"

      # Host keys come from a secret rather than `StrictHostKeyChecking=no`.
      # Accepting any key on a deploy connection means anything that can
      # answer on that address gets handed a registry token and a shell
      # command; pinning is the entire defence.
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The compose files, the Caddyfile and the deploy script are the only
      # things the server needs from the repository, and they are copied here
      # rather than pulled: no git remote, no credentials and no working tree
      # on the VPS. `.env` is never sent — it lives on the server and is the
      # one piece of state this pipeline does not own.
      - name: Ship the deploy bundle
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/easy-point-api' }}
        run: |
          tar czf bundle.tar.gz \
            compose.yaml compose.prod.yaml compose.registry.yaml \
            Caddyfile docker deploy
          scp -i ~/.ssh/id_deploy bundle.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/bundle.tar.gz"
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_DIR' && tar xzf /tmp/bundle.tar.gz -C '$DEPLOY_DIR' && rm /tmp/bundle.tar.gz && chmod +x '$DEPLOY_DIR/deploy/deploy.sh'"

      # GITHUB_TOKEN rather than a stored PAT: it is scoped to this repository
      # and expires when the job ends, so a compromised VPS does not yield a
      # registry credential that outlives the incident.
      - name: Authenticate the server to the registry
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/easy-point-api' }}
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' IMAGE_REPO='${{ steps.target.outputs.repo }}' bash '$DEPLOY_DIR/deploy/deploy.sh' '${{ steps.target.outputs.tag }}'"

      # Leaving the runner's credential in the server's docker config would
      # keep a token on disk that nothing on the box needs between deploys.
      - name: Drop the registry credential
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" "docker logout ghcr.io" || true
