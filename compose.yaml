services:

  # ── NestJS API (dev – hot reload) ─────────────────────────────────────────
  easy-point-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: easy-point-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      # Inside Docker, services reach each other by service name, not localhost.
      - REDIS_HOST=social-redis
      # Runtime connects as the unprivileged app role, which is subject to RLS.
      # Migrations use DIRECT_URL (the owner), which is intentionally exempt.
      - DATABASE_URL=postgresql://${POSTGRES_APP_USER:-easypoint_app}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - DIRECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      # Hot-reload: monta src en vivo; node_modules queda aislado en el contenedor
      - ./src:/app/src
      - ./prisma:/app/prisma
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      social-redis:
        condition: service_healthy
    networks:
      - easy-point-net

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: easy-point-postgres
    restart: unless-stopped
    ports:
      # Loopback-only: lets you point Prisma Studio / a local DB client at it
      # without exposing the database beyond the host machine.
      # Override POSTGRES_HOST_PORT if the host already runs Postgres on 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - easy-point-net

  # ── Redis cache ────────────────────────────────────────────────────────────
  social-redis:
    image: redis:7-alpine
    container_name: social-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --logLevel warning
    restart: unless-stopped
    ports:
      # Loopback-only — was previously exposed to 0.0.0.0.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - easy-point-net

  # ── Redis Commander – Web UI (dev tooling only) ─────────────────────────────
  # Not started by default: `docker compose --profile tools up`
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    hostname: redis-commander
    profiles:
      - tools
    environment:
      - REDIS_HOSTS=local:social-redis:6379:0:${REDIS_PASSWORD}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      social-redis:
        condition: service_healthy
    networks:
      - easy-point-net

networks:
  easy-point-net:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
