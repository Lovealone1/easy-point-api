# Production override. Usage:
#   docker compose -f compose.yaml -f compose.prod.yaml --profile migrate run --rm migrate
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
# `!reset []` explicitly clears a list inherited from compose.yaml (dev bind
# mounts, loopback port publishing) instead of relying on list-merge/concat
# semantics, which would otherwise keep the dev values around in production.

services:

  easy-point-api:
    build:
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
    # No published ports: only Caddy talks to this service, over the internal network.
    ports: !reset []
    # No source bind mounts: the image already contains the compiled build.
    volumes: !reset []
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    restart: always
    ports: !reset []
    # Baseline tuning for a ~4GB VPS running Postgres + Node + Redis + Caddy
    # on the same box. Adjust shared_buffers/effective_cache_size upward if
    # the VPS has more headroom — see docs/DEPLOYMENT.md.
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  social-redis:
    restart: always
    ports: !reset []
    command: redis-server --requirepass ${REDIS_PASSWORD} --logLevel warning --appendonly yes
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Caddy — TLS termination + reverse proxy ─────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: easy-point-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      easy-point-api:
        condition: service_healthy
    networks:
      - easy-point-net

  # ── Encrypted off-site Postgres backups ─────────────────────────────────────
  # Only the variables actually needed are passed through — this container
  # never needs JWT/SMTP/app secrets, only DB + backup destination creds.
  postgres-backup:
    build:
      context: ./docker/backup
    container_name: easy-point-postgres-backup
    restart: unless-stopped
    environment:
      - PGHOST=postgres
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 3 * * *}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-${S3_ENDPOINT}}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET}
      - BACKUP_S3_PREFIX=${BACKUP_S3_PREFIX:-postgres-backups}
      - BACKUP_S3_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY_ID:-${S3_ACCESS_KEY_ID}}
      - BACKUP_S3_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_ACCESS_KEY:-${S3_SECRET_ACCESS_KEY}}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - easy-point-net

  # ── One-shot migration runner ────────────────────────────────────────────
  # docker compose -f compose.yaml -f compose.prod.yaml --profile migrate run --rm migrate
  # Only DATABASE_URL/DIRECT_URL are needed — this runs the Prisma CLI
  # directly, it never boots the Nest app (so no JWT/SMTP/S3 vars required).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: easy-point-migrate
    profiles:
      - migrate
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - DIRECT_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["pnpm", "prisma:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - easy-point-net

volumes:
  caddy_data:
  caddy_config:
